<!DOCTYPE html>
<html lang="vi">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<head>
    <meta charset="UTF-8" />
    <title>Chúc Mừng Sinh Nhật!</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            color: rgb(253, 245, 230);
            font-family: 'Pacifico', cursive;
            text-align: center;
        }

        #message {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            font-weight: bold;
            z-index: 2;
            white-space: pre-line;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div id="message"></div>
    <canvas id="fireworksCanvas"></canvas>

    <script>
        function fireworksAnimation() {
            const canvas = document.getElementById("fireworksCanvas");
            const ctx = canvas.getContext("2d");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            function random(min, max) {
                return Math.random() * (max - min) + min;
            }

            function Firework() {
                this.x = canvas.width / 2;
                this.y = canvas.height;
                this.xEnd = random(0, canvas.width);
                this.yEnd = random(0, canvas.height / 2);
                this.radius = 1;
                this.speed = random(1, 5);
                this.acceleration = 1.05;
                this.distanceToEnd = Math.sqrt((this.xEnd - this.x) ** 2 + (this.yEnd - this.y) ** 2);
                this.angle = Math.atan2(this.yEnd - this.y, this.xEnd - this.x);
                this.dx = Math.cos(this.angle) * this.speed;
                this.dy = Math.sin(this.angle) * this.speed;
                this.life = true;
                const brightColors = ["#FF0000", "#FFA500", "#FFFF00", "#00FF00", "#00FFFF", "#0000FF", "#FF69B4", "#FF00FF"];
                this.color = brightColors[Math.floor(Math.random() * brightColors.length)];
            }

            Firework.prototype.update = function () {
                this.dx *= this.acceleration;
                this.dy *= this.acceleration;
                this.distanceToEnd = Math.sqrt((this.xEnd - this.x) ** 2 + (this.yEnd - this.y) ** 2);
                if (this.distanceToEnd <= 50) {
                    this.life = false;
                    createParticles(this.xEnd, this.yEnd, this.color);
                }
                this.x += this.dx;
                this.y += this.dy;
            };

            Firework.prototype.draw = function () {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            };

            function Particle(x, y, dx, dy, color) {
                this.x = x;
                this.y = y;
                this.dx = dx;
                this.dy = dy;
                this.radius = random(1, 4);
                this.life = 100;
                this.color = color;
            }

            Particle.prototype.update = function () {
                this.x += this.dx;
                this.y += this.dy;
                this.life -= 1;
            };

            Particle.prototype.draw = function () {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            };

            const fireworks = [];
            const particles = [];

            function createParticles(x, y, color) {
                const pattern = Math.floor(Math.random() * 7);

                for (let i = 0; i < 50; i++) {
                    let angle, speed;
                    switch (pattern) {
                        case 0: // Tròn đều
                            angle = (Math.PI * 2 * i) / 50;
                            speed = random(1, 3);
                            particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color));
                            break;

                        case 1: // Ngôi sao
                            angle = (Math.PI * 2 * i * 5) / 50;
                            speed = random(2, 4);
                            particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color));
                            break;

                        case 2: // Xoắn ốc
                            angle = (Math.PI * 2 * i) / 50 + random(-0.5, 0.5);
                            speed = i / 25;
                            particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color));
                            break;

                        case 3: // Tia chớp ngẫu nhiên
                            particles.push(new Particle(x, y, random(-4, 4), random(-4, 4), color));
                            break;

                        case 4: // Cánh quạt xoay
                            angle = (Math.PI * 2 * i) / 50 + performance.now() / 500;
                            speed = 2 + Math.sin(i + performance.now() / 200);
                            particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color));
                            break;

                        case 5: // Vòng xoay đồng tâm
                            angle = (Math.PI * 2 * i) / 50;
                            speed = 2 + 1.5 * Math.sin(i);
                            particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color));
                            break;

                        case 6: // Trái tim
                            angle = (Math.PI * 2 * i) / 50;
                            const rHeart = 10 * (1 - Math.sin(angle));
                            const xHeart = 16 * Math.pow(Math.sin(angle), 3);
                            const yHeart = -(
                                13 * Math.cos(angle) -
                                5 * Math.cos(2 * angle) -
                                2 * Math.cos(3 * angle) -
                                Math.cos(4 * angle)
                            );
                            particles.push(new Particle(x, y, xHeart * 0.2, yHeart * 0.2, color));
                            break;


                    }
                }
            }

            function handleParticles() {
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                        i--;
                    }
                }
            }

            function handleFireworks() {
                for (let i = 0; i < fireworks.length; i++) {
                    fireworks[i].update();
                    fireworks[i].draw();
                    if (!fireworks[i].life) {
                        fireworks.splice(i, 1);
                        i--;
                    }
                }
            }

            function animate() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                handleFireworks();
                handleParticles();
                if (Math.random() < 0.03) {
                    fireworks.push(new Firework());
                }
                requestAnimationFrame(animate);
            }

            animate();
        }

        function getBirthdayInfoFromURL() {
            const params = new URLSearchParams(window.location.search);
            const datePart = params.get("bd");
            const namePart = params.get("n");

            if (!datePart || !namePart) return null;

            const [dayStr, monthStr] = datePart.split("_");
            const day = parseInt(dayStr, 10);
            const month = parseInt(monthStr, 10) - 1;

            return {
                day,
                month,
                name: namePart.replace(/_/g, " "),
            };
        }

        const birthdayInfo = getBirthdayInfoFromURL();
        const today = new Date();
        const messageEl = document.getElementById("message");

        if (birthdayInfo) {
            const { day, month, name } = birthdayInfo;
            if (today.getDate() === day && today.getMonth() === month) {
                messageEl.innerText = `🎉 Chúc mừng sinh nhật ${name}! 🎂\nChúc bạn luôn vui vẻ và hạnh phúc!`;
                fireworksAnimation();
            } else {
                messageEl.innerText = ``;
            }
        } else {
            messageEl.innerText = "";
        }
    </script>
</body>

</html>
